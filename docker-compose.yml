version: '3.8'

services:

  postgres-master:
    image: postgres:15
    container_name: postgres-master
    environment:
      POSTGRES_DB: cqrs_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - master-data:/var/lib/postgresql/data

  postgres-replica:
    image: postgres:15
    container_name: postgres-replica
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5434:5432"
    volumes:
      - replica-data:/var/lib/postgresql/data
    depends_on:
      - postgres-master

volumes:
  master-data:
  replica-data: